<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F8F2E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>مكعبات بلس</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1865663769174674"
     crossorigin="anonymous"></script>
<style>
/* ============================================================
   مكعبات بلس — Mokabbat Plus
   Premium navy/blue block-blast style puzzle
   ============================================================ */

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
html{
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro","Segoe UI",
              "Noto Sans Arabic",Tahoma,Arial,sans-serif;
  background:#F8F2E9;
  color:#172A46;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}

:root{
  --navy:#172A46;
  --c-dark:#1F3B63;
  --c-deep:#244B78;
  --c-blue:#326FA3;
  --c-lite:#5B9BD5;
  --c-gray:#7894B2;

  --bg1:#FFFDF8;
  --bg2:#F8F2E9;
  --bg3:#EEE5DA;

  --plate:#E7EDF4;
  --plate-edge:#D3DDE8;
  --well:#D6E0EB;
  --well-in:#C6D3E1;

  --cell:40px;
  --gap:4px;
  --step:44px;
  --pad:9px;
  --tcell:20px;
  --tgap:2px;
  --tstep:22px;
  --radius:0.26;
}

/* ---------- background ---------- */
.bg{
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% -10%, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
}
.blob{ position:absolute; border-radius:50%; filter:blur(50px); opacity:.30; }
.b1{ width:52vmax;height:52vmax; left:-22vmax; top:-18vmax;
     background:radial-gradient(circle at 35% 35%, #9EC2E6, rgba(158,194,230,0)); }
.b2{ width:44vmax;height:44vmax; right:-18vmax; top:16vmax;
     background:radial-gradient(circle at 50% 50%, #B9CBDD, rgba(185,203,221,0)); opacity:.26; }
.b3{ width:60vmax;height:60vmax; left:-10vmax; bottom:-30vmax;
     background:radial-gradient(circle at 50% 50%, #A7BEDA, rgba(167,190,218,0)); opacity:.22; }
.grain{
  position:absolute; inset:0; opacity:.30; pointer-events:none;
  background-image:radial-gradient(rgba(23,42,70,.055) 1px, transparent 1px);
  background-size:3px 3px;
}

/* ---------- stage ---------- */
.stage{
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
  height:100dvh; height:100vh;
  padding:calc(env(safe-area-inset-top) + 6px) 5px calc(env(safe-area-inset-bottom) + 6px);
  will-change:transform;
}
@supports (height:100dvh){ .stage{ height:100dvh; } }

/* ---------- header ---------- */
.hd{ width:100%; max-width:520px; flex:0 0 auto; }
.hd-top{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; padding:2px 2px 6px;
}
.title{
  margin:0; font-size:clamp(19px,5.4vw,26px); font-weight:800; letter-spacing:.2px;
  background:linear-gradient(180deg,#2C4E7C,#172A46);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.icon-btn{
  width:36px; height:36px; flex:0 0 auto; border:0; cursor:pointer;
  border-radius:12px; font-size:16px; line-height:1;
  color:#2A4568;
  background:linear-gradient(180deg,#FFFFFF,#EAF0F7);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,
             0 -2px 0 rgba(23,42,70,.07) inset,
             0 3px 8px rgba(23,42,70,.13);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s ease;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:active{ transform:scale(.90); box-shadow:0 1px 3px rgba(23,42,70,.16); }
.icon-btn.off{ opacity:.45; }
.iconGroup{ display:flex; gap:8px; }
a.icon-btn{ text-decoration:none; }

.stats{
  display:flex; align-items:stretch; justify-content:center; gap:8px;
  direction:ltr;
}
.stat{
  flex:1 1 0; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; padding:7px 4px 8px;
  border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(233,240,247,.86));
  box-shadow:0 1px 0 rgba(255,255,255,.95) inset,
             0 -2px 0 rgba(23,42,70,.06) inset,
             0 4px 12px rgba(23,42,70,.10);
}
.stat .lbl{ font-size:10.5px; font-weight:700; color:#6C87A6; letter-spacing:.3px; }
.stat .val{
  font-size:20px; font-weight:800; color:var(--navy);
  font-variant-numeric:tabular-nums; line-height:1.1;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.stat.main{ flex:1.25 1 0; }
.stat.main .val{ font-size:26px;
  background:linear-gradient(180deg,#326FA3,#172A46);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.stat .val.bump{ transform:scale(1.24); }
.stat.hot{ box-shadow:0 1px 0 rgba(255,255,255,.95) inset,
             0 -2px 0 rgba(23,42,70,.06) inset,
             0 4px 16px rgba(50,111,163,.38),
             0 0 0 2px rgba(91,155,213,.45); }

/* combo chip */
.combochip{
  margin:6px auto 0; width:max-content; min-width:96px;
  padding:4px 14px; border-radius:999px;
  font-size:12px; font-weight:800; letter-spacing:.4px; color:#fff;
  background:linear-gradient(180deg,#5B9BD5,#244B78);
  box-shadow:0 3px 10px rgba(36,75,120,.40), 0 1px 0 rgba(255,255,255,.35) inset;
  opacity:0; transform:translateY(-6px) scale(.86);
  transition:opacity .22s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
  text-align:center; direction:rtl;
}
.combochip.on{ opacity:1; transform:translateY(0) scale(1); }

/* ---------- board ---------- */
.boardWrap{
  flex:1 1 auto; width:100%;
  display:flex; align-items:center; justify-content:center;
  min-height:0; padding:6px 0;
}
.board{
  position:relative; direction:ltr;
  padding:var(--pad);
  border-radius:calc(var(--pad) * 2.4);
  background:linear-gradient(180deg,#F1F5FA 0%, var(--plate) 55%, #DEE7F0 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.95) inset,
    0 -3px 0 rgba(23,42,70,.06) inset,
    0 0 0 1px rgba(23,42,70,.055),
    0 14px 34px rgba(23,42,70,.16),
    0 3px 8px rgba(23,42,70,.09);
}
.wells{
  display:grid;
  grid-template-columns:repeat(8, var(--cell));
  grid-template-rows:repeat(8, var(--cell));
  gap:var(--gap);
}
.well{
  border-radius:calc(var(--cell) * var(--radius));
  background:linear-gradient(180deg,var(--well-in),var(--well));
  box-shadow:
    inset 0 1.5px 3px rgba(23,42,70,.16),
    inset 0 -1px 0 rgba(255,255,255,.55);
  position:relative;
  transition:box-shadow .18s ease, background .18s ease;
}
.well.willclear{
  background:linear-gradient(180deg,#BFD9F2,#A9C9EA);
  box-shadow:
    inset 0 1px 3px rgba(23,42,70,.12),
    0 0 12px rgba(91,155,213,.75);
}
.layer{ position:absolute; inset:var(--pad); pointer-events:none; }
#tileLayer{ z-index:3; }
#ghostLayer{ z-index:2; }
#lineFx{ z-index:4; }

/* ---------- tile ---------- */
.tile{
  position:absolute; left:0; top:0;
  width:var(--cell); height:var(--cell);
  border-radius:calc(var(--cell) * var(--radius));
  background:linear-gradient(178deg,
      var(--t) 0%,
      var(--b) 44%,
      var(--b) 62%,
      var(--d) 100%);
  box-shadow:
    inset 0 calc(var(--cell)*0.055) 0 rgba(255,255,255,.30),
    inset 0 calc(var(--cell)*-0.085) 0 rgba(0,0,0,.30),
    inset 0 0 calc(var(--cell)*0.34) rgba(0,0,0,.20),
    inset 0 0 0 1px rgba(255,255,255,.10),
    0 calc(var(--cell)*0.055) calc(var(--cell)*0.13) rgba(19,32,54,.30);
  will-change:transform;
  transform:translateZ(0);
}
.tile::before{
  content:''; position:absolute;
  left:11%; right:11%; top:7%; height:34%;
  border-radius:calc(var(--cell)*0.19) calc(var(--cell)*0.19) 70% 70% /
                calc(var(--cell)*0.17) calc(var(--cell)*0.17) 100% 100%;
  background:linear-gradient(180deg, rgba(255,255,255,.40), rgba(255,255,255,.02));
  pointer-events:none;
}
.tile::after{
  content:''; position:absolute; right:12%; bottom:11%;
  width:22%; height:15%; border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.20), rgba(255,255,255,0) 70%);
  pointer-events:none;
}

@keyframes tilePop{
  0%  { transform:scale(.82) translateZ(0); filter:brightness(1.18); }
  55% { transform:scale(1.07) translateZ(0); filter:brightness(1.10); }
  78% { transform:scale(.985) translateZ(0); }
  100%{ transform:scale(1) translateZ(0); filter:brightness(1); }
}
.tile.pop{ animation:tilePop .34s cubic-bezier(.3,1.3,.5,1) both; }

@keyframes shineSweep{
  0%  { transform:translateX(-140%) skewX(-18deg); opacity:0; }
  25% { opacity:.9; }
  100%{ transform:translateX(160%) skewX(-18deg); opacity:0; }
}
.tile .shine{
  position:absolute; inset:0; overflow:hidden; border-radius:inherit; pointer-events:none;
}
.tile .shine i{
  position:absolute; top:-20%; bottom:-20%; left:0; width:52%;
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
  animation:shineSweep .5s ease-out .06s both;
}

/* ---------- ghost ---------- */
.gcell{
  position:absolute; left:0; top:0;
  width:var(--cell); height:var(--cell);
  border-radius:calc(var(--cell) * var(--radius));
  transition:opacity .12s ease;
}
.gcell.ok{
  background:linear-gradient(180deg, rgba(91,155,213,.42), rgba(36,75,120,.34));
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.42),
    inset 0 2px 5px rgba(255,255,255,.28),
    0 0 14px rgba(50,111,163,.45);
}
.gcell.bad{
  background:repeating-linear-gradient(45deg,
    rgba(120,148,178,.26) 0 6px, rgba(120,148,178,.10) 6px 12px);
  box-shadow:inset 0 0 0 2px rgba(105,132,161,.62);
}
@keyframes ghostBreathe{
  0%,100%{ opacity:.86 } 50%{ opacity:1 }
}
#ghostLayer.live .gcell.ok{ animation:ghostBreathe 1.1s ease-in-out infinite; }

/* line flash */
.lineflash{
  position:absolute; border-radius:calc(var(--cell)*0.3);
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(200,228,255,.95), rgba(255,255,255,0));
  pointer-events:none; mix-blend-mode:screen;
}

/* ---------- tray ---------- */
.tray{
  flex:0 0 auto; direction:ltr;
  width:100%; max-width:520px;
  display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
  padding:8px 6px calc(6px);
  border-radius:20px;
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(226,234,243,.60));
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -2px 0 rgba(23,42,70,.05) inset,
    0 6px 18px rgba(23,42,70,.09);
  margin-top:4px;
}
.slot{
  position:relative;
  min-height:calc(var(--tstep) * 3.7);
  display:flex; align-items:center; justify-content:center;
  border-radius:14px;
  background:linear-gradient(180deg, rgba(214,224,235,.42), rgba(198,211,225,.30));
  box-shadow:inset 0 1px 3px rgba(23,42,70,.09);
  cursor:grab;
  touch-action:none;
}
.slot:empty{ cursor:default; }
body.dragging, body.dragging .slot{ cursor:grabbing; }
.piece{
  position:relative;
  transform-origin:50% 50%;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), opacity .18s ease, filter .18s ease;
  filter:drop-shadow(0 3px 5px rgba(23,42,70,.20));
}
.piece.dead{ opacity:0; transform:scale(.55) !important; }
@keyframes pieceIn{
  0%  { opacity:0; transform:translateY(16px) scale(.5); }
  60% { opacity:1; transform:translateY(-3px) scale(1.06); }
  100%{ opacity:1; transform:translateY(0) scale(1); }
}
.piece.enter{ animation:pieceIn .42s cubic-bezier(.3,1.35,.5,1) both; }
.slot.grabbed .piece{ opacity:0; }
.slot.nofit .piece{ filter:grayscale(.55) opacity(.55) drop-shadow(0 2px 3px rgba(23,42,70,.12)); }

/* ---------- drag layer ---------- */
#dragLayer{ position:fixed; inset:0; z-index:60; pointer-events:none; }
.dragOuter{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
.dragInner{ position:relative; transform-origin:50% 60%; will-change:transform; }
.dragInner .tile{
  box-shadow:
    inset 0 calc(var(--cell)*0.055) 0 rgba(255,255,255,.34),
    inset 0 calc(var(--cell)*-0.085) 0 rgba(0,0,0,.30),
    inset 0 0 calc(var(--cell)*0.34) rgba(0,0,0,.20),
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 calc(var(--cell)*0.14) calc(var(--cell)*0.30) rgba(19,32,54,.34);
}
.dragOuter.invalid .dragInner{ filter:saturate(.45) opacity(.72); }
.dragShadow{
  position:absolute; border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(23,42,70,.32), rgba(23,42,70,0) 70%);
  filter:blur(2px); pointer-events:none;
}
@keyframes floatBob{
  0%,100%{ transform:translateY(0) }
  50%    { transform:translateY(-2.5px) }
}
.bobber{ animation:floatBob 1.6s ease-in-out infinite; }

/* ---------- fx ---------- */
#fx{ position:fixed; inset:0; z-index:55; pointer-events:none; overflow:hidden; }
.spark{ position:absolute; left:0; top:0; border-radius:50%; will-change:transform,opacity; }
.ring{
  position:absolute; left:0; top:0; border-radius:50%;
  border:2px solid rgba(91,155,213,.85); will-change:transform,opacity;
}
.floatTxt{
  position:absolute; left:0; top:0; font-weight:800; white-space:nowrap;
  direction:ltr; unicode-bidi:isolate; font-variant-numeric:tabular-nums;
  color:#244B78; text-shadow:0 2px 6px rgba(255,255,255,.9); will-change:transform,opacity;
}
.comboTxt{
  position:absolute; left:0; top:0; font-weight:900; white-space:nowrap;
  letter-spacing:.5px; direction:rtl;
  background:linear-gradient(180deg,#7FB6E4,#1F3B63);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 10px rgba(91,155,213,.65)) drop-shadow(0 1px 0 rgba(255,255,255,.8));
  will-change:transform,opacity;
}

/* ---------- modal ---------- */
.modal{
  position:fixed; inset:0; z-index:80;
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  background:rgba(238,229,218,.55);
  -webkit-backdrop-filter:blur(10px) saturate(1.1);
  backdrop-filter:blur(10px) saturate(1.1);
  opacity:0; pointer-events:none;
  transition:opacity .3s ease;
}
.modal.on{ opacity:1; pointer-events:auto; }
.card{
  width:100%; max-width:330px; padding:24px 22px 20px;
  border-radius:26px; text-align:center;
  background:linear-gradient(180deg,#FFFFFF,#EFF4FA);
  box-shadow:
    0 1px 0 rgba(255,255,255,.95) inset,
    0 -3px 0 rgba(23,42,70,.06) inset,
    0 24px 60px rgba(23,42,70,.30);
  transform:scale(.80) translateY(24px); opacity:0;
  transition:transform .42s cubic-bezier(.3,1.4,.5,1), opacity .28s ease;
}
.modal.on .card{ transform:scale(1) translateY(0); opacity:1; }
.card h2{ margin:0 0 4px; font-size:25px; font-weight:900; color:var(--navy); }
.card .sub{ font-size:12.5px; color:#7894B2; font-weight:700; margin-bottom:16px; }
.res{ display:flex; gap:10px; direction:ltr; margin-bottom:18px; }
.res .box{
  flex:1; padding:12px 6px 13px; border-radius:16px;
  background:linear-gradient(180deg,#EFF4FA,#DFE8F2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 0 rgba(23,42,70,.05);
}
.res .box .k{ font-size:11px; font-weight:700; color:#6C87A6; }
.res .box .v{ font-size:27px; font-weight:900; color:var(--navy); font-variant-numeric:tabular-nums; }
.res .box.b .v{ background:linear-gradient(180deg,#5B9BD5,#1F3B63);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.btn{
  width:100%; border:0; cursor:pointer; padding:15px 18px;
  border-radius:18px; font-size:16.5px; font-weight:800; color:#fff;
  font-family:inherit;
  background:linear-gradient(180deg,#4A8AC4 0%, #326FA3 48%, #244B78 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.32) inset,
    0 -4px 0 rgba(15,32,54,.36) inset,
    0 8px 20px rgba(36,75,120,.42);
  transition:transform .14s cubic-bezier(.34,1.56,.64,1), box-shadow .14s ease;
}
.btn:active{ transform:translateY(3px) scale(.985);
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset, 0 -1px 0 rgba(15,32,54,.35) inset, 0 3px 8px rgba(36,75,120,.35); }
.newbest{
  display:none; margin:0 auto 14px; width:max-content;
  padding:7px 18px; border-radius:999px;
  font-size:13px; font-weight:900; color:#fff; letter-spacing:.4px;
  background:linear-gradient(180deg,#5B9BD5,#244B78);
  box-shadow:0 6px 18px rgba(36,75,120,.45), 0 1px 0 rgba(255,255,255,.35) inset;
}
.newbest.on{ display:block; animation:nbPop .6s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes nbPop{
  0%{ transform:scale(.4) rotate(-6deg); opacity:0 }
  60%{ transform:scale(1.12) rotate(2deg); opacity:1 }
  100%{ transform:scale(1) rotate(0); opacity:1 }
}

/* toast for new best during play */
.toast{
  position:fixed; left:50%; top:18%; z-index:70;
  transform:translate(-50%,-14px) scale(.8); opacity:0;
  padding:10px 22px; border-radius:999px;
  font-size:14px; font-weight:900; color:#fff; letter-spacing:.4px; white-space:nowrap;
  background:linear-gradient(180deg,#5B9BD5,#1F3B63);
  box-shadow:0 10px 28px rgba(36,75,120,.45), 0 1px 0 rgba(255,255,255,.35) inset;
  pointer-events:none;
  transition:opacity .3s ease, transform .5s cubic-bezier(.3,1.5,.5,1);
}
.toast.on{ opacity:1; transform:translate(-50%,0) scale(1); }

.hint{
  position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
  font-size:11px; color:#8AA3BE; font-weight:700; pointer-events:none;
  opacity:1; transition:opacity .4s ease;
}
.hint.hide{ opacity:0; }

@media (max-height:680px){
  .stat .val{ font-size:17px } .stat.main .val{ font-size:22px }
  .stat{ padding:5px 4px 6px } .title{ font-size:19px }
  .hd-top{ padding-bottom:3px }
}
</style>
</head>
<body>
<div class="bg">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  <span class="grain"></span>
</div>

<div class="stage" id="stage">
  <header class="hd">
    <div class="hd-top">
      <div class="iconGroup">
        <a class="icon-btn" href="../" aria-label="الرئيسية">🏠</a>
        <button class="icon-btn" id="soundBtn" aria-label="الصوت">🔊</button>
      </div>
      <h1 class="title">مكعبات بلس</h1>
      <button class="icon-btn" id="restartBtn" aria-label="إعادة">↻</button>
    </div>
    <div class="stats">
      <div class="stat" id="bestCard"><span class="lbl">أفضل</span><span class="val" id="bestVal">0</span></div>
      <div class="stat main" id="scoreCard"><span class="lbl">النقاط</span><span class="val" id="scoreVal">0</span></div>
      <div class="stat" id="linesCard"><span class="lbl">الخطوط</span><span class="val" id="linesVal">0</span></div>
    </div>
    <div class="combochip" id="comboChip">كومبو ×2</div>
  </header>

  <div class="boardWrap">
    <div class="board" id="board">
      <div class="wells" id="wells"></div>
      <div class="layer" id="ghostLayer"></div>
      <div class="layer" id="tileLayer"></div>
      <div class="layer" id="lineFx"></div>
    </div>
  </div>

  <div class="tray" id="tray">
    <div class="slot" data-i="0"></div>
    <div class="slot" data-i="1"></div>
    <div class="slot" data-i="2"></div>
  </div>
</div>

<div id="fx"></div>
<div id="dragLayer"></div>
<div class="toast" id="toast">رقم قياسي جديد! 🎉</div>

<div class="modal" id="modal">
  <div class="card">
    <div class="newbest" id="nbBadge">رقم قياسي جديد!</div>
    <h2>انتهت اللعبة</h2>
    <div class="sub">لا توجد حركات متاحة</div>
    <div class="res">
      <div class="box b"><div class="k">نتيجتك</div><div class="v" id="finalScore">0</div></div>
      <div class="box"><div class="k">أفضل</div><div class="v" id="finalBest">0</div></div>
    </div>
    <button class="btn" id="againBtn">العب مرة ثانية</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ==========================================================
   CONSTANTS
   ========================================================== */
const N = 8;
const $ = s => document.querySelector(s);

const root       = document.documentElement;
const stage      = $('#stage');
const boardEl    = $('#board');
const wellsEl    = $('#wells');
const ghostLayer = $('#ghostLayer');
const tileLayer  = $('#tileLayer');
const lineFx     = $('#lineFx');
const trayEl     = $('#tray');
const dragLayer  = $('#dragLayer');
const fxLayer    = $('#fx');
const modal      = $('#modal');
const toastEl    = $('#toast');

const COLORS = [
  { base:'#1F3B63', top:'#3A5C8A', bot:'#13253E', glow:'#4C7CB4' }, // dark blue
  { base:'#244B78', top:'#3F6FA2', bot:'#16304E', glow:'#5A8FC4' }, // deep blue
  { base:'#326FA3', top:'#4F94C9', bot:'#204C74', glow:'#6FAADB' }, // blue
  { base:'#5B9BD5', top:'#86BEEC', bot:'#3D77AC', glow:'#9CCCF4' }, // light blue
  { base:'#7894B2', top:'#9DB6D0', bot:'#566F8C', glow:'#AFC6DC' }, // cool blue-gray
  { base:'#172A46', top:'#2E4A72', bot:'#0D1728', glow:'#3A5F92' }, // navy ink
];

/* shape grids — '#' filled. weight = relative spawn frequency */
const SHAPE_DEFS = [
  { w:6,  g:['#'] },
  { w:9,  g:['##'] },
  { w:9,  g:['#','#'] },
  { w:9,  g:['###'] },
  { w:9,  g:['#','#','#'] },
  { w:7,  g:['####'] },
  { w:7,  g:['#','#','#','#'] },
  { w:3,  g:['#####'] },
  { w:3,  g:['#','#','#','#','#'] },
  { w:9,  g:['##','##'] },
  { w:2,  g:['###','###','###'] },
  { w:4,  g:['###','###'] },
  { w:4,  g:['##','##','##'] },
  /* small corners (3) */
  { w:8,  g:['##','#.'] },
  { w:8,  g:['##','.#'] },
  { w:8,  g:['#.','##'] },
  { w:8,  g:['.#','##'] },
  /* big corners (5) */
  { w:4,  g:['###','#..','#..'] },
  { w:4,  g:['###','..#','..#'] },
  { w:4,  g:['#..','#..','###'] },
  { w:4,  g:['..#','..#','###'] },
  /* L / J tetrominoes */
  { w:5,  g:['#.','#.','##'] },
  { w:5,  g:['.#','.#','##'] },
  { w:5,  g:['##','#.','#.'] },
  { w:5,  g:['##','.#','.#'] },
  { w:5,  g:['###','#..'] },
  { w:5,  g:['###','..#'] },
  { w:5,  g:['#..','###'] },
  { w:5,  g:['..#','###'] },
  /* T tetrominoes */
  { w:5,  g:['###','.#.'] },
  { w:5,  g:['.#.','###'] },
  { w:5,  g:['#.','##','#.'] },
  { w:5,  g:['.#','##','.#'] },
  /* S / Z */
  { w:4,  g:['.##','##.'] },
  { w:4,  g:['##.','.##'] },
  { w:4,  g:['#.','##','.#'] },
  { w:4,  g:['.#','##','#.'] },
];

const SHAPES = SHAPE_DEFS.map(d => {
  const cells = [];
  d.g.forEach((row,r) => { for (let c=0;c<row.length;c++) if (row[c] === '#') cells.push([r,c]); });
  return { cells, rows:d.g.length, cols:Math.max.apply(null, d.g.map(r=>r.length)), weight:d.w };
});
const TOTAL_W = SHAPES.reduce((a,s)=>a+s.weight,0);

/* ==========================================================
   SOUND (synthesised — no external assets)
   ========================================================== */
const Snd = (function(){
  let ctx = null, master = null, muted = false;
  function ready(){
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch(e){ return false; }
    master = ctx.createGain(); master.gain.value = 0.45; master.connect(ctx.destination);
    return true;
  }
  function tone(freq, dur, type, vol, when, slideTo){
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + (when||0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, when, freq, q){
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + (when||0);
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value = freq||1400; f.Q.value = q||0.9;
    const g = ctx.createGain(); g.gain.value = vol || 0.12;
    s.connect(f); f.connect(g); g.connect(master); s.start(t0);
  }
  return {
    unlock(){ return ready(); },
    get muted(){ return muted; },
    set muted(v){ muted = v; },
    pickup(){ tone(560,0.07,'sine',0.10); tone(840,0.06,'sine',0.06,0.035); },
    tick(){ tone(1180,0.022,'sine',0.032); },
    place(){ noise(0.05,0.10,0,1500,1.2); tone(220,0.10,'triangle',0.15,0,120); tone(660,0.05,'sine',0.05,0.01); },
    invalid(){ tone(190,0.10,'sawtooth',0.05,0,150); },
    clear(lines){
      const sc = [523.25,659.25,783.99,1046.5,1318.5];
      const n = Math.min(5, 2 + lines);
      noise(0.16,0.14,0,900,0.6);
      for (let i=0;i<n;i++) tone(sc[i], 0.20, 'triangle', 0.13, i*0.045, sc[i]*1.5);
      tone(110,0.20,'sine',0.16,0,70);
    },
    combo(n){
      const base = 392 * Math.pow(1.06, Math.min(n,10));
      for (let i=0;i<3;i++) tone(base*Math.pow(1.26,i), 0.16, 'square', 0.055, i*0.06);
    },
    best(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.20,'triangle',0.13,i*0.075)); },
    over(){ [440,370,294,220].forEach((f,i)=>tone(f,0.32,'triangle',0.13,i*0.13)); }
  };
})();

function buzz(p){ if (navigator.vibrate) { try { navigator.vibrate(p); } catch(e){} } }

/* ==========================================================
   STATE
   ========================================================== */
let grid   = new Array(N*N).fill(-1);   // -1 empty, else colour index
let tiles  = new Array(N*N).fill(null); // DOM refs
let wells  = [];
let score = 0, best = 0, lines = 0, combo = 0, placedCount = 0;
let tray = [null,null,null];
let gameOver = false, bestBeaten = false;
let M = { cell:40, gap:4, step:44, pad:9, tcell:20, tgap:2, tstep:22 };

try { best = parseInt(localStorage.getItem('mokabbat_best') || '0', 10) || 0; } catch(e){ best = 0; }
try { Snd.muted = localStorage.getItem('mokabbat_mute') === '1'; } catch(e){}

/* ==========================================================
   LAYOUT
   ========================================================== */
function metricsFor(c){
  const g  = Math.max(3, Math.round(c * 0.09));
  const pd = Math.max(6, Math.round(c * 0.22));
  const tc = Math.max(11, Math.round(c * 0.50));
  const tg = Math.max(2,  Math.round(g * 0.55));
  const ts = tc + tg;
  return {
    cell:c, gap:g, pad:pd, step:c+g,
    tcell:tc, tgap:tg, tstep:ts,
    boardOuter: 8*c + 7*g + 2*pd,
    trayH: Math.ceil(ts * 3.7) + 16
  };
}

function layout(){
  const hd = document.querySelector('.hd');
  const cs = getComputedStyle(stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop)  + parseFloat(cs.paddingBottom);
  const availW  = Math.min(stage.clientWidth - padX, 500);
  const budgetH = stage.clientHeight - padY - hd.offsetHeight - 14;

  let m = null;
  for (let c = 56; c >= 18; c--){
    const t = metricsFor(c);
    if (t.boardOuter <= availW && (t.boardOuter + t.trayH + 8) <= budgetH){ m = t; break; }
  }
  if (!m) m = metricsFor(18);

  // spend leftover vertical room on a roomier tray (easier finger targets)
  const slack = budgetH - m.boardOuter - m.trayH - 8;
  if (slack > 24){
    const grown = Math.floor((m.trayH + Math.min(slack - 16, 120) - 16) / 3.7);
    const ts = Math.min(grown, Math.round(m.cell * 0.72));
    if (ts > m.tstep){
      m.tstep = ts;
      m.tcell = ts - m.tgap;
      m.trayH = Math.ceil(ts * 3.7) + 16;
    }
  }
  M = m;

  root.style.setProperty('--cell',  m.cell  + 'px');
  root.style.setProperty('--gap',   m.gap   + 'px');
  root.style.setProperty('--step',  m.step  + 'px');
  root.style.setProperty('--pad',   m.pad   + 'px');
  root.style.setProperty('--tcell', m.tcell + 'px');
  root.style.setProperty('--tgap',  m.tgap  + 'px');
  root.style.setProperty('--tstep', m.tstep + 'px');
  const uiW = Math.max(m.boardOuter, 300) + 'px';
  trayEl.style.maxWidth = uiW;
  hd.style.maxWidth = uiW;

  for (let i=0;i<N*N;i++){
    const t = tiles[i];
    if (t) posAt(t, (i/N)|0, i%N);
  }
  renderTray(false);
}

function posAt(el, r, c){
  el.style.left = (c * M.step) + 'px';
  el.style.top  = (r * M.step) + 'px';
}

/* ==========================================================
   TILE FACTORY
   ========================================================== */
function makeTile(ci, cellVar){
  const d = document.createElement('div');
  d.className = 'tile';
  const C = COLORS[ci];
  d.style.setProperty('--b', C.base);
  d.style.setProperty('--t', C.top);
  d.style.setProperty('--d', C.bot);
  d.style.setProperty('--g', C.glow);
  if (cellVar) d.style.setProperty('--cell', cellVar);
  return d;
}
function addShine(t){
  const s = document.createElement('div'); s.className = 'shine';
  const i = document.createElement('i'); s.appendChild(i); t.appendChild(s);
  setTimeout(()=>{ if (s.parentNode) s.remove(); }, 620);
}

/* ==========================================================
   BOARD BUILD
   ========================================================== */
function buildWells(){
  wellsEl.textContent = '';
  wells = [];
  for (let i=0;i<N*N;i++){
    const w = document.createElement('div');
    w.className = 'well';
    wellsEl.appendChild(w);
    wells.push(w);
  }
}

/* ==========================================================
   PIECE HELPERS
   ========================================================== */
function randShape(){
  let r = Math.random() * TOTAL_W;
  for (let i=0;i<SHAPES.length;i++){ r -= SHAPES[i].weight; if (r <= 0) return SHAPES[i]; }
  return SHAPES[0];
}
function newPiece(){
  const s = randShape();
  return { shape:s, color: (Math.random()*COLORS.length)|0 };
}
function fits(piece, r0, c0, g){
  const cells = piece.shape.cells;
  for (let k=0;k<cells.length;k++){
    const r = r0 + cells[k][0], c = c0 + cells[k][1];
    if (r < 0 || c < 0 || r >= N || c >= N) return false;
    if ((g||grid)[r*N + c] !== -1) return false;
  }
  return true;
}
function canPlaceAnywhere(piece, g){
  const s = piece.shape;
  for (let r=0; r <= N - s.rows; r++)
    for (let c=0; c <= N - s.cols; c++)
      if (fits(piece, r, c, g)) return true;
  return false;
}
function anyMoveLeft(){
  for (let i=0;i<3;i++) if (tray[i] && canPlaceAnywhere(tray[i])) return true;
  return false;
}

/* ==========================================================
   TRAY RENDER
   ========================================================== */
function buildPieceEl(piece, cellPx, gapPx){
  const s = piece.shape;
  const step = cellPx + gapPx;
  const el = document.createElement('div');
  el.className = 'piece';
  el.style.width  = (s.cols*step - gapPx) + 'px';
  el.style.height = (s.rows*step - gapPx) + 'px';
  el.style.setProperty('--cell', cellPx + 'px');
  for (let k=0;k<s.cells.length;k++){
    const t = makeTile(piece.color, cellPx + 'px');
    t.style.left = (s.cells[k][1]*step) + 'px';
    t.style.top  = (s.cells[k][0]*step) + 'px';
    el.appendChild(t);
  }
  return el;
}

function renderTray(animate){
  const slots = trayEl.children;
  for (let i=0;i<3;i++){
    const slot = slots[i];
    const piece = tray[i];
    slot.textContent = '';
    slot.classList.remove('grabbed','nofit');
    if (!piece) continue;

    const el = buildPieceEl(piece, M.tcell, M.tgap);
    slot.appendChild(el);

    // fit inside slot
    const sw = slot.clientWidth  - 8;
    const sh = slot.clientHeight - 8;
    const pw = parseFloat(el.style.width), ph = parseFloat(el.style.height);
    const fit = Math.min(1, sw/pw, sh/ph);
    piece._fit = fit;
    piece._el  = el;
    el.style.transform = 'scale(' + fit + ')';
    if (animate) el.classList.add('enter');
    if (!canPlaceAnywhere(piece)) slot.classList.add('nofit');
    if (drag && drag.idx === i) slot.classList.add('grabbed');
  }
}

function refillTray(){
  // Try to deal a set that has at least one playable piece.
  let set = null;
  for (let attempt=0; attempt<60; attempt++){
    const cand = [newPiece(), newPiece(), newPiece()];
    const playable = cand.some(p => canPlaceAnywhere(p));
    if (playable){ set = cand; break; }
    if (attempt === 59) set = cand;
  }
  tray = set;
  renderTray(true);
}

/* ==========================================================
   FX HELPERS
   ========================================================== */
function boardOrigin(){
  const r = ghostLayer.getBoundingClientRect();
  return { x:r.left, y:r.top };
}
function cellCenterScreen(r, c){
  const o = boardOrigin();
  return { x: o.x + c*M.step + M.cell/2, y: o.y + r*M.step + M.cell/2 };
}

/* animations are cosmetic only: never gate game state on onfinish, and always
   guarantee DOM cleanup even if the tab stops painting (throttled/background) */
function cleanup(el, anim, ms){
  const kill = () => { if (el.parentNode) el.remove(); };
  if (anim){ anim.onfinish = kill; anim.oncancel = kill; }
  setTimeout(kill, ms);
}

function spark(x, y, color, power){
  const el = document.createElement('div');
  el.className = 'spark';
  const size = 3 + Math.random()*5;
  el.style.width = size+'px'; el.style.height = size+'px';
  el.style.background = color;
  el.style.boxShadow = '0 0 6px ' + color;
  fxLayer.appendChild(el);
  const ang = Math.random()*Math.PI*2;
  const dist = (18 + Math.random()*46) * (power||1);
  const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 14*(power||1);
  const dur = 380 + Math.random()*380;
  const a = el.animate([
    { transform:'translate3d('+x+'px,'+y+'px,0) scale(1)', opacity:1 },
    { transform:'translate3d('+(x+dx*0.6)+'px,'+(y+dy*0.7)+'px,0) scale(.8)', opacity:.9, offset:.55 },
    { transform:'translate3d('+(x+dx)+'px,'+(y+dy+26)+'px,0) scale(0)', opacity:0 }
  ], { duration:dur, easing:'cubic-bezier(.15,.7,.35,1)' });
  cleanup(el, a, dur + 120);
}
function burst(x, y, color, count, power){
  for (let i=0;i<count;i++) spark(x, y, color, power||1);
}
function ringAt(x, y, size, color){
  const el = document.createElement('div');
  el.className = 'ring';
  el.style.width = size+'px'; el.style.height = size+'px';
  el.style.borderColor = color || 'rgba(91,155,213,.85)';
  fxLayer.appendChild(el);
  const a = el.animate([
    { transform:'translate3d('+(x-size/2)+'px,'+(y-size/2)+'px,0) scale(.2)', opacity:.95, borderWidth:'3px' },
    { transform:'translate3d('+(x-size/2)+'px,'+(y-size/2)+'px,0) scale(1.5)', opacity:0, borderWidth:'1px' }
  ], { duration:520, easing:'cubic-bezier(.1,.7,.3,1)' });
  cleanup(el, a, 640);
}
function floatText(x, y, txt, size, color){
  const el = document.createElement('div');
  el.className = 'floatTxt';
  el.textContent = txt;
  el.style.fontSize = (size||16)+'px';
  if (color) el.style.color = color;
  fxLayer.appendChild(el);
  const w = el.offsetWidth;
  const a = el.animate([
    { transform:'translate3d('+(x-w/2)+'px,'+y+'px,0) scale(.6)', opacity:0 },
    { transform:'translate3d('+(x-w/2)+'px,'+(y-16)+'px,0) scale(1.1)', opacity:1, offset:.25 },
    { transform:'translate3d('+(x-w/2)+'px,'+(y-58)+'px,0) scale(1)', opacity:0 }
  ], { duration:950, easing:'cubic-bezier(.2,.8,.3,1)' });
  cleanup(el, a, 1080);
}
function comboText(txt, level){
  const el = document.createElement('div');
  el.className = 'comboTxt';
  el.textContent = txt;
  const size = Math.min(58, 26 + level*5);
  el.style.fontSize = size + 'px';
  fxLayer.appendChild(el);
  const b = boardEl.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  const x = b.left + b.width/2 - w/2;
  const y = b.top + b.height*0.36 - h/2;
  const a = el.animate([
    { transform:'translate3d('+x+'px,'+y+'px,0) scale(.35) rotate(-7deg)', opacity:0 },
    { transform:'translate3d('+x+'px,'+(y-8)+'px,0) scale(1.24) rotate(2deg)', opacity:1, offset:.28 },
    { transform:'translate3d('+x+'px,'+(y-16)+'px,0) scale(1) rotate(0deg)', opacity:1, offset:.46 },
    { transform:'translate3d('+x+'px,'+(y-84)+'px,0) scale(.92) rotate(0deg)', opacity:0 }
  ], { duration:1150, easing:'cubic-bezier(.2,.9,.3,1)' });
  cleanup(el, a, 1280);
}
let shakeAnim = null, settleAnim = null;
function shake(power){
  const p = Math.min(power, 9);
  const kf = [{ transform:'translate3d(0,0,0)' }];
  const n = 5 + Math.round(p/2);
  for (let i=0;i<n;i++){
    const f = (1 - i/n) * p;
    kf.push({ transform:'translate3d('+((Math.random()*2-1)*f).toFixed(2)+'px,'+((Math.random()*2-1)*f*0.8).toFixed(2)+'px,0)' });
  }
  kf.push({ transform:'translate3d(0,0,0)' });
  if (shakeAnim) { try { shakeAnim.cancel(); } catch(e){} }
  shakeAnim = stage.animate(kf, { duration: 200 + p*22, easing:'ease-out' });
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('on'), 1600);
}

/* ==========================================================
   SCORE / HUD
   ========================================================== */
function bump(el){
  el.classList.add('bump');
  setTimeout(()=>el.classList.remove('bump'), 190);
}
function setScore(v){
  score = v;
  $('#scoreVal').textContent = score;
  bump($('#scoreVal'));
  if (score > best){
    best = score;
    $('#bestVal').textContent = best;
    try { localStorage.setItem('mokabbat_best', String(best)); } catch(e){}
    if (!bestBeaten && placedCount > 2){
      bestBeaten = true;
      toast('رقم قياسي جديد! 🎉');
      Snd.best(); buzz([12,40,12]);
      $('#bestCard').classList.add('hot');
      const b = boardEl.getBoundingClientRect();
      burst(b.left + b.width/2, b.top + b.height/2, '#5B9BD5', 26, 1.5);
    }
  }
}
function setLines(v){ lines = v; $('#linesVal').textContent = lines; bump($('#linesVal')); }
function showCombo(){
  const chip = $('#comboChip');
  if (combo >= 2){ chip.textContent = 'كومبو ×' + combo; chip.classList.add('on'); }
  else chip.classList.remove('on');
}

/* ==========================================================
   PLACEMENT + CLEARING
   ========================================================== */
function fullLines(){
  const rows = [], cols = [];
  for (let r=0;r<N;r++){
    let f = true;
    for (let c=0;c<N;c++) if (grid[r*N+c] === -1){ f = false; break; }
    if (f) rows.push(r);
  }
  for (let c=0;c<N;c++){
    let f = true;
    for (let r=0;r<N;r++) if (grid[r*N+c] === -1){ f = false; break; }
    if (f) cols.push(c);
  }
  return { rows, cols };
}

function commitPlacement(piece, r0, c0){
  const cells = piece.shape.cells;
  const o = boardOrigin();

  cells.forEach((cc, k) => {
    const r = r0 + cc[0], c = c0 + cc[1];
    const i = r*N + c;
    grid[i] = piece.color;
    const t = makeTile(piece.color);
    posAt(t, r, c);
    tileLayer.appendChild(t);
    tiles[i] = t;
    t.style.animationDelay = (k * 16) + 'ms';
    t.classList.add('pop');
    addShine(t);
    setTimeout(() => t.classList.remove('pop'), 420 + k * 16);
  });

  placedCount++;
  Snd.place();
  buzz(9);

  // placement sparks
  const c0s = cellCenterScreen(r0 + (piece.shape.rows-1)/2, c0 + (piece.shape.cols-1)/2);
  burst(c0s.x, c0s.y, 'rgba(140,196,238,.95)', 7, 0.55);

  setScore(score + cells.length);

  const { rows, cols } = fullLines();
  const total = rows.length + cols.length;

  if (total > 0){
    combo++;
    doClear(rows, cols, total);
  } else {
    if (combo >= 2) { /* combo ends */ }
    combo = 0;
    showCombo();
  }

  return total;
}

function doClear(rows, cols, total){
  const idx = new Set();
  rows.forEach(r => { for (let c=0;c<N;c++) idx.add(r*N+c); });
  cols.forEach(c => { for (let r=0;r<N;r++) idx.add(r*N+c); });

  const list = Array.from(idx);
  const cx = list.reduce((a,i)=>a + (i%N), 0) / list.length;
  const cy = list.reduce((a,i)=>a + ((i/N)|0), 0) / list.length;

  // detach from model immediately (visuals animate independently)
  const doomed = [];
  list.forEach(i => {
    const t = tiles[i];
    grid[i] = -1;
    tiles[i] = null;
    if (t){
      const r = (i/N)|0, c = i%N;
      const d = Math.hypot(r-cy, c-cx);
      doomed.push({ t, r, c, delay: d * 26 });
    }
  });

  // line sweep flashes
  const o = boardOrigin();
  rows.forEach((r,k) => lineFlash(0, r*M.step - M.gap/2, N*M.step - M.gap, M.cell + M.gap, true, k*40));
  cols.forEach((c,k) => lineFlash(c*M.step - M.gap/2, 0, M.cell + M.gap, N*M.step - M.gap, false, k*40));

  doomed.forEach(({t, r, c, delay}, n) => {
    const anim = t.animate([
      { transform:'scale(1)',    filter:'brightness(1) saturate(1)',      opacity:1, offset:0 },
      { transform:'scale(1.10)', filter:'brightness(1.85) saturate(1.25)', opacity:1, offset:.30 },
      { transform:'scale(0.96)', filter:'brightness(1.55)',               opacity:1, offset:.44 },
      { transform:'scale(1.34)', filter:'brightness(2.4) saturate(1.1)',  opacity:.95, offset:.66 },
      { transform:'scale(0.10)', filter:'brightness(2.6)',                opacity:0, offset:1 }
    ], { duration: 460, delay: delay, easing:'cubic-bezier(.3,.85,.35,1)', fill:'forwards' });
    cleanup(t, anim, delay + 620);

    if (n % 2 === 0){
      setTimeout(() => {
        const p = cellCenterScreen(r, c);
        burst(p.x, p.y, COLORS[0].glow, 3 + Math.min(4,total), 0.85 + total*0.18);
      }, delay + 210);
    }
  });

  // centre shockwave
  const mid = cellCenterScreen(cy, cx);
  setTimeout(()=>{
    ringAt(mid.x, mid.y, M.cell*2.4, 'rgba(91,155,213,.8)');
    if (total >= 2) ringAt(mid.x, mid.y, M.cell*3.6, 'rgba(36,75,120,.5)');
  }, 150);

  // board settle
  setTimeout(()=>{
    if (settleAnim) { try { settleAnim.cancel(); } catch(e){} }
    settleAnim = tileLayer.animate([
      { transform:'scale(1)' }, { transform:'scale(.982)' }, { transform:'scale(1.006)' }, { transform:'scale(1)' }
    ], { duration:340, easing:'cubic-bezier(.3,1.3,.5,1)' });
  }, 380);

  // score
  const mult = 1 + 0.5 * Math.max(0, combo - 1);
  const basePts = total * (total + 1) / 2 * 10;
  const pts = Math.round(basePts * mult);
  setTimeout(()=> setScore(score + pts), 260);
  setLines(lines + total);

  floatText(mid.x, mid.y - M.cell, '+' + pts, 18 + Math.min(14, total*4), '#244B78');

  Snd.clear(total);
  shake(2.4 + total * 1.4 + Math.min(3, combo));
  buzz(total >= 2 ? [14,26,18] : 16);

  if (combo >= 2){
    showCombo();
    setTimeout(()=>{
      comboText('كومبو ×' + combo, combo);
      Snd.combo(combo);
      shake(2 + combo);
      const b = boardEl.getBoundingClientRect();
      burst(b.left + b.width/2, b.top + b.height*0.36, '#5B9BD5', 10 + combo*5, 1 + combo*0.22);
      buzz([10,30,10,30,14]);
    }, 300);
  } else if (total >= 2){
    setTimeout(()=> comboText(total + ' خطوط!', 2), 280);
  }
}

function lineFlash(x, y, w, h, horiz, delay){
  const el = document.createElement('div');
  el.className = 'lineflash';
  el.style.left = x+'px'; el.style.top = y+'px';
  el.style.width = w+'px'; el.style.height = h+'px';
  if (!horiz) el.style.background =
    'linear-gradient(180deg, rgba(255,255,255,0), rgba(200,228,255,.95), rgba(255,255,255,0))';
  lineFx.appendChild(el);
  const a = el.animate([
    { opacity:0, transform: horiz ? 'scaleX(.2)' : 'scaleY(.2)' },
    { opacity:1, transform:'scale(1)', offset:.35 },
    { opacity:0, transform: horiz ? 'scaleX(1.05)' : 'scaleY(1.05)' }
  ], { duration:520, delay:delay||0, easing:'ease-out' });
  cleanup(el, a, (delay||0) + 640);
}

/* ==========================================================
   GHOST PREVIEW
   ========================================================== */
let ghostCells = [];
let lastGhostKey = '';

function clearGhost(){
  if (ghostCells.length){ ghostLayer.textContent = ''; ghostCells = []; }
  for (let i=0;i<wells.length;i++) if (wells[i].classList.contains('willclear')) wells[i].classList.remove('willclear');
  lastGhostKey = '';
}

function drawGhost(piece, r0, c0, valid){
  const key = r0 + ',' + c0 + ',' + (valid?1:0);
  if (key === lastGhostKey) return;
  lastGhostKey = key;

  ghostLayer.textContent = '';
  ghostCells = [];
  for (let i=0;i<wells.length;i++) wells[i].classList.remove('willclear');

  const cells = piece.shape.cells;
  const frag = document.createDocumentFragment();
  let anyVisible = false;

  for (let k=0;k<cells.length;k++){
    const r = r0 + cells[k][0], c = c0 + cells[k][1];
    if (r < 0 || c < 0 || r >= N || c >= N) continue;
    anyVisible = true;
    const g = document.createElement('div');
    g.className = 'gcell ' + (valid ? 'ok' : 'bad');
    if (valid){
      const C = COLORS[piece.color];
      g.style.background = 'linear-gradient(180deg,' + hexA(C.top,0.78) + ',' + hexA(C.base,0.68) + ')';
      g.style.boxShadow = 'inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 0 3.5px ' + hexA(C.bot,0.55) + ', 0 0 16px ' + hexA(C.glow,0.6);
    }
    posAt(g, r, c);
    frag.appendChild(g);
    ghostCells.push(g);
  }
  ghostLayer.appendChild(frag);
  ghostLayer.classList.toggle('live', valid && anyVisible);

  // preview which lines would clear
  if (valid){
    const sim = grid.slice();
    for (let k=0;k<cells.length;k++){
      const r = r0 + cells[k][0], c = c0 + cells[k][1];
      sim[r*N+c] = piece.color;
    }
    for (let r=0;r<N;r++){
      let f = true; for (let c=0;c<N;c++) if (sim[r*N+c] === -1){ f=false; break; }
      if (f) for (let c=0;c<N;c++) wells[r*N+c].classList.add('willclear');
    }
    for (let c=0;c<N;c++){
      let f = true; for (let r=0;r<N;r++) if (sim[r*N+c] === -1){ f=false; break; }
      if (f) for (let r=0;r<N;r++) wells[r*N+c].classList.add('willclear');
    }
  }
}

function hexA(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

/* ==========================================================
   DRAG & DROP
   ========================================================== */
let drag = null;
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);

function onPointerDown(e){
  if (gameOver || drag) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const slot = e.target.closest ? e.target.closest('.slot') : null;
  if (!slot || !trayEl.contains(slot)) return;
  const idx = parseInt(slot.dataset.i, 10);
  const piece = tray[idx];
  if (!piece || !piece._el) return;

  e.preventDefault();
  Snd.unlock();

  const pieceEl = piece._el;
  const pr = pieceEl.getBoundingClientRect();
  const s = piece.shape;
  const pieceW = s.cols * M.step - M.gap;
  const pieceH = s.rows * M.step - M.gap;
  const startScale = pr.width / pieceW;

  // build floating piece at full board scale
  const outer = document.createElement('div');
  outer.className = 'dragOuter';

  const shadow = document.createElement('div');
  shadow.className = 'dragShadow';
  shadow.style.width  = (pieceW * 0.88) + 'px';
  shadow.style.height = (M.cell * 0.62) + 'px';
  shadow.style.left   = (pieceW * 0.06) + 'px';
  shadow.style.top    = (pieceH - M.cell*0.10) + 'px';
  outer.appendChild(shadow);

  const pop = document.createElement('div');
  pop.className = 'dragInner';
  pop.style.position = 'relative';
  pop.style.width  = pieceW + 'px';
  pop.style.height = pieceH + 'px';

  const inner = document.createElement('div');
  inner.style.position = 'relative';
  inner.style.width  = pieceW + 'px';
  inner.style.height = pieceH + 'px';
  inner.style.transformOrigin = '50% 50%';
  inner.style.willChange = 'transform';

  for (let k=0;k<s.cells.length;k++){
    const t = makeTile(piece.color);
    t.style.left = (s.cells[k][1] * M.step) + 'px';
    t.style.top  = (s.cells[k][0] * M.step) + 'px';
    inner.appendChild(t);
  }
  pop.appendChild(inner);
  outer.appendChild(pop);
  dragLayer.appendChild(outer);

  const fx = clamp((pr.width ? (e.clientX - pr.left) / pr.width : .5), 0.06, 0.94);
  // the finger always sits a constant gap BELOW the piece, whatever its height,
  // so the board stays visible underneath the block being carried
  const gapBelow = clamp(M.cell * 0.85, 34, 62);

  drag = {
    piece, idx, outer, pop, inner, shadow,
    pieceW, pieceH,
    anchorX: fx * pieceW,
    anchorY: pieceH + gapBelow,
    startRect: { x: pr.left, y: pr.top, s: startScale },
    boardRect: ghostLayer.getBoundingClientRect(),
    x: e.clientX, y: e.clientY,
    lastX: e.clientX, vx: 0,
    r0: 0, c0: 0, valid: false,
    settled: false, raf: 0, t0: performance.now(),
    pointerId: e.pointerId
  };

  // start at the tray position, then lift into the hand
  outer.style.transform = 'translate3d(' + pr.left + 'px,' + pr.top + 'px,0) scale(' + startScale + ')';
  slot.classList.add('grabbed');

  // force style flush, then animate to hand
  outer.getBoundingClientRect();
  outer.style.transition = 'transform .13s cubic-bezier(.25,.9,.35,1)';
  applyDragTransform();
  setTimeout(() => { if (drag && drag.outer === outer) outer.style.transition = ''; }, 145);

  pop.animate([
    { transform:'scale(.80)' },
    { transform:'scale(1.07)', offset:.55 },
    { transform:'scale(1)' }
  ], { duration:230, easing:'cubic-bezier(.3,1.4,.5,1)' });

  updateGhost();
  tick();

  Snd.pickup(); buzz(8);

  // capture keeps the drag alive if the pointer leaves the window entirely
  try { trayEl.setPointerCapture(e.pointerId); } catch(err){}
  document.body.classList.add('dragging');

  window.addEventListener('pointermove', onPointerMove, { passive:false });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
}

function applyDragTransform(){
  if (!drag) return;
  const L = drag.x - drag.anchorX;
  const T = drag.y - drag.anchorY;
  drag.left = L; drag.top = T;
  drag.outer.style.transform = 'translate3d(' + L.toFixed(2) + 'px,' + T.toFixed(2) + 'px,0)';
}

function updateGhost(){
  if (!drag) return;
  const b = drag.boardRect;
  const c0 = Math.round((drag.left - b.left) / M.step);
  const r0 = Math.round((drag.top  - b.top)  / M.step);
  const s = drag.piece.shape;

  const near = r0 > -s.rows && r0 < N && c0 > -s.cols && c0 < N;
  const valid = near && fits(drag.piece, r0, c0);

  if (valid && (r0 !== drag.r0 || c0 !== drag.c0 || !drag.valid)) Snd.tick();

  drag.r0 = r0; drag.c0 = c0; drag.valid = valid;
  drag.outer.classList.toggle('invalid', !valid);
  drag.shadow.style.opacity = valid ? '1' : '.45';

  if (near) drawGhost(drag.piece, r0, c0, valid);
  else clearGhost();
}

function onPointerMove(e){
  if (!drag) return;
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  drag.vx = drag.vx * 0.78 + (x - drag.lastX) * 0.22;
  drag.lastX = x;
  drag.x = x; drag.y = y;
  applyDragTransform();
  updateGhost();
}

function tick(){
  if (!drag) return;
  const t = performance.now() - drag.t0;
  const tilt = clamp(drag.vx * 0.55, -4, 4);
  const bob  = Math.sin(t / 420) * 2.4;
  drag.inner.style.transform = 'translate3d(0,' + bob.toFixed(2) + 'px,0) rotate(' + tilt.toFixed(2) + 'deg)';
  drag.vx *= 0.9;
  drag.raf = requestAnimationFrame(tick);
}

function onPointerUp(e){
  if (!drag) return;
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerUp);
  cancelAnimationFrame(drag.raf);
  try { trayEl.releasePointerCapture(drag.pointerId); } catch(err){}
  document.body.classList.remove('dragging');

  const d = drag;
  drag = null;
  clearGhost();
  d.outer.style.transition = '';
  d.inner.style.transform = 'none';

  const slot = trayEl.children[d.idx];
  const cancelled = (e && e.type === 'pointercancel');

  if (d.valid && !cancelled){
    // the carried block "lands": snap it onto the exact cell, then hand over to
    // the real tiles. State is committed synchronously — the glide is cosmetic.
    const targetX = d.boardRect.left + d.c0 * M.step;
    const targetY = d.boardRect.top  + d.r0 * M.step;
    const a = d.outer.animate([
      { transform:'translate3d(' + d.left + 'px,' + d.top + 'px,0)', opacity:1 },
      { transform:'translate3d(' + targetX + 'px,' + targetY + 'px,0)', opacity:1, offset:.7 },
      { transform:'translate3d(' + targetX + 'px,' + targetY + 'px,0)', opacity:0 }
    ], { duration:120, easing:'cubic-bezier(.3,.75,.3,1)', fill:'forwards' });
    cleanup(d.outer, a, 200);

    tray[d.idx] = null;
    const p = slot.querySelector('.piece');
    if (p){ p.classList.add('dead'); setTimeout(()=>{ if (p.parentNode) p.remove(); }, 220); }
    slot.classList.remove('grabbed');
    commitPlacement(d.piece, d.r0, d.c0);
    afterPlacement();
  } else {
    // spring back into its tray slot
    const a = d.outer.animate([
      { transform:'translate3d(' + d.left + 'px,' + d.top + 'px,0) scale(1)' },
      { transform:'translate3d(' + ((d.left + d.startRect.x)/2) + 'px,' + ((d.top + d.startRect.y)/2 - 10) + 'px,0) scale(' + ((1+d.startRect.s)/2) + ')', offset:.5 },
      { transform:'translate3d(' + d.startRect.x + 'px,' + d.startRect.y + 'px,0) scale(' + d.startRect.s + ')' }
    ], { duration:300, easing:'cubic-bezier(.35,.2,.25,1)', fill:'forwards' });
    cleanup(d.outer, a, 380);
    slot.classList.remove('grabbed');
    if (!cancelled) Snd.invalid();
  }
}

function afterPlacement(){
  for (let i=0;i<3;i++){
    const slot = trayEl.children[i];
    slot.classList.toggle('nofit', !!tray[i] && !canPlaceAnywhere(tray[i]));
  }
  if (!tray[0] && !tray[1] && !tray[2]){
    setTimeout(()=>{ if (gameOver) return; refillTray(); checkOver(); }, 300);
  } else {
    checkOver();
  }
}
function checkOver(){
  if (gameOver) return;
  if (!anyMoveLeft()){
    setTimeout(()=>{ if (!gameOver && !anyMoveLeft()) endGame(); }, 620);
  }
}

/* ==========================================================
   GAME OVER / RESTART
   ========================================================== */
function endGame(){
  gameOver = true;
  Snd.over(); buzz([26,60,26,60,40]);
  $('#finalScore').textContent = score;
  $('#finalBest').textContent  = best;
  $('#nbBadge').classList.toggle('on', bestBeaten);
  modal.classList.add('on');
  shake(4);
}

function restart(){
  modal.classList.remove('on');
  gameOver = false; bestBeaten = false;
  combo = 0; placedCount = 0;
  $('#bestCard').classList.remove('hot');
  showCombo();

  // sweep existing tiles away
  const existing = [];
  for (let i=0;i<N*N;i++) if (tiles[i]) existing.push({ t:tiles[i], i });
  existing.forEach(({t,i}, n) => {
    const r = (i/N)|0, c = i%N;
    const a = t.animate([
      { transform:'scale(1)', opacity:1 },
      { transform:'scale(.1)', opacity:0 }
    ], { duration:240, delay:(r+c)*11, easing:'cubic-bezier(.4,0,.6,1)', fill:'forwards' });
    cleanup(t, a, (r+c)*11 + 380);
  });

  grid  = new Array(N*N).fill(-1);
  tiles = new Array(N*N).fill(null);
  for (let i=0;i<wells.length;i++) wells[i].classList.remove('willclear');

  setScore(0); score = 0; $('#scoreVal').textContent = '0';
  lines = 0; $('#linesVal').textContent = '0';
  $('#bestVal').textContent = best;

  refillTray();
}

/* ==========================================================
   INIT
   ========================================================== */
function syncSoundBtn(){
  const b = $('#soundBtn');
  b.textContent = Snd.muted ? '🔇' : '🔊';
  b.classList.toggle('off', Snd.muted);
}

buildWells();
layout();
$('#bestVal').textContent = best;
$('#scoreVal').textContent = '0';
$('#linesVal').textContent = '0';
syncSoundBtn();
refillTray();
// second pass once fonts/metrics settle
requestAnimationFrame(()=>{ layout(); });

trayEl.addEventListener('pointerdown', onPointerDown, { passive:false });
trayEl.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive:false });
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive:false });

$('#restartBtn').addEventListener('click', ()=>{ Snd.unlock(); restart(); });
$('#againBtn').addEventListener('click', ()=>{ Snd.unlock(); restart(); });
$('#soundBtn').addEventListener('click', ()=>{
  Snd.unlock();
  Snd.muted = !Snd.muted;
  try { localStorage.setItem('mokabbat_mute', Snd.muted ? '1' : '0'); } catch(e){}
  syncSoundBtn();
  if (!Snd.muted) Snd.pickup();
});

let rzT = 0;
function onResize(){ clearTimeout(rzT); rzT = setTimeout(layout, 80); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=> setTimeout(layout, 240));
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

// expose a tiny hook for automated testing
window.__mk = {
  get state(){ return { score, best, lines, combo, gameOver, grid: grid.slice(), tray: tray.map(p=>p&&p.shape) }; },
  fill(idxs, ci){
    idxs.forEach(i => {
      if (grid[i] !== -1) return;
      grid[i] = ci||2;
      const t = makeTile(ci||2); posAt(t,(i/N)|0,i%N); tileLayer.appendChild(t); tiles[i]=t;
    });
  },
  setTray(list){ tray = list.map(k => ({ shape: SHAPES[k], color: 2 })); renderTray(true); },
  M: () => M,
  restart: restart
};

})();
</script>
