<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c1c28">
<title>لعبتك</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap');

  :root{
    --sea:#0c1c28; --sea2:#122a3a; --tile:#16303f; --tile-border:#2b4a5d;
    --pearl:#f3ecdc; --dim:#8ba3b3; --gold:#d8b45a;
    --correct:#2f9b77; --present:#c9932b;
    --blocks:#5B9BD5; --blocks-deep:#244B78;
    --itlak:#38e8ff; --itlak-red:#ff3b4e;
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    min-height:100dvh; overflow-x:hidden;
    background:
      radial-gradient(640px 420px at 82% 6%, rgba(216,180,90,.10), rgba(216,180,90,0) 60%),
      radial-gradient(560px 380px at 12% 96%, rgba(91,155,213,.09), rgba(91,155,213,0) 60%),
      radial-gradient(1200px 600px at 50% -10%, var(--sea2), var(--sea) 70%);
    color:var(--pearl); font-family:'Tajawal', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  .hub{ width:100%; max-width:700px; padding:44px 22px 48px; display:flex; flex-direction:column; align-items:center; gap:30px; }

  .heading{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .logo{
    width:min(340px, 74vw); height:auto; display:block;
    filter:drop-shadow(0 0 30px rgba(216,180,90,.24));
  }
  .sub{ font-size:.94rem; color:var(--dim); font-weight:500; text-wrap:balance; }

  .games{ width:100%; display:flex; flex-direction:column; gap:14px; }
  @media (min-width:600px){ .games{ flex-direction:row; flex-wrap:wrap; } }
  @media (min-width:600px){ .games .card{ flex-basis:calc(50% - 7px); } }
  @media (min-width:860px){ .games .card{ flex-basis:0; } }

  .card{
    --glow: rgba(216,180,90,.28);
    flex:1; display:flex; align-items:center; gap:16px;
    padding:18px 18px; border-radius:20px;
    border:1px solid var(--tile-border);
    background:linear-gradient(160deg, var(--sea2), var(--tile) 75%);
    text-decoration:none; color:var(--pearl);
    position:relative; overflow:hidden;
    transition:transform .2s cubic-bezier(.22,.85,.32,1), box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 14px 34px var(--glow);
    border-color:var(--gold);
  }
  .card:active{ transform:translateY(-1px) scale(.99); }
  .card:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .card.blocks{ --glow: rgba(91,155,213,.30); }
  .card.blocks:hover, .card.blocks:focus-visible{ border-color:var(--blocks); }
  .card.itlak{ --glow: rgba(56,232,255,.32); }
  .card.itlak:hover, .card.itlak:focus-visible{ border-color:var(--itlak); }

  .icon{ flex:0 0 auto; width:60px; height:60px; display:flex; align-items:center; justify-content:center; }

  /* دانة icon: three mini letter tiles */
  .tiles{ display:flex; gap:3px; }
  .tiles span{
    width:17px; height:17px; border-radius:5px; display:flex; align-items:center; justify-content:center;
    font-size:.62rem; font-weight:800; color:#06231a;
  }
  .tiles span:nth-child(1){ background:radial-gradient(circle at 35% 30%, #49bd95, var(--correct) 65%); }
  .tiles span:nth-child(2){ background:var(--present); color:#241a04; }
  .tiles span:nth-child(3){ background:var(--tile); border:1.5px solid var(--tile-border); color:var(--dim); }

  /* مكعبات icon: mini L-block */
  .blockshape{ position:relative; width:44px; height:44px; }
  .sq{
    position:absolute; width:18px; height:18px; border-radius:5px;
    background:linear-gradient(178deg,#4F94C9,#204C74 70%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.28);
  }
  .sq.a{ left:0; top:0; } .sq.b{ left:20px; top:0; } .sq.c{ left:0; top:20px; }

  /* إطلاق icon: mini crosshair target */
  .crosshair{ position:relative; width:46px; height:46px; }
  .crosshair .ring{
    position:absolute; border-radius:50%; border:2px solid var(--itlak);
    box-shadow:0 0 10px rgba(56,232,255,.55);
  }
  .crosshair .ring.outer{ inset:0; }
  .crosshair .ring.inner{ inset:14px; border-color:var(--itlak-red); }
  .crosshair .dot{
    position:absolute; inset:20px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--itlak) 70%);
  }
  .crosshair .line{ position:absolute; background:rgba(56,232,255,.5); }
  .crosshair .line.v{ left:50%; top:2px; bottom:2px; width:1px; transform:translateX(-50%); }
  .crosshair .line.h{ top:50%; left:2px; right:2px; height:1px; transform:translateY(-50%); }

  .text{ display:flex; flex-direction:column; gap:3px; text-align:right; }
  .text h2{ font-size:1.12rem; font-weight:800; }
  .card.dana h2{ color:var(--gold); }
  .card.blocks h2{ color:var(--blocks); }
  .card.itlak h2{ color:var(--itlak); }
  .text p{ font-size:.8rem; color:var(--dim); font-weight:500; }

  .go{ flex:0 0 auto; margin-inline-start:auto; font-size:1.1rem; color:var(--dim); opacity:.7; transition:transform .2s ease; }
  .card:hover .go{ transform:translateX(-4px); opacity:1; }

  @media (prefers-reduced-motion: reduce){
    .card, .go{ transition:none; }
    .card:hover{ transform:none; }
  }

  /* ---------- account ---------- */
  .account-chip{
    position:fixed; top:16px; inset-inline-end:16px; z-index:50;
    display:flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:999px; cursor:pointer;
    background:rgba(8,16,26,.72); border:1px solid var(--tile-border);
    color:var(--dim); font-size:.78rem; font-weight:700; font-family:inherit;
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    transition:border-color .2s ease, color .2s ease;
  }
  .account-chip.signed-in{ color:var(--gold); border-color:rgba(216,180,90,.45); }
  .account-chip:hover{ border-color:var(--gold); }

  .modal-overlay{
    position:fixed; inset:0; z-index:100; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(2,6,10,.72); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    position:relative; width:100%; max-width:360px; padding:30px 24px 24px;
    border-radius:20px; text-align:center;
    background:linear-gradient(160deg, var(--sea2), var(--tile) 75%);
    border:1px solid var(--tile-border);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .modal-card h2{ font-size:1.1rem; font-weight:800; color:var(--gold); margin-bottom:6px; }
  .modal-sub{ font-size:.8rem; color:var(--dim); margin-bottom:18px; }
  .modal-field{ text-align:right; margin-bottom:12px; }
  .modal-field label{ display:block; font-size:.72rem; color:var(--dim); margin-bottom:5px; }
  .modal-field input{
    width:100%; padding:10px 12px; border-radius:10px; font-size:.9rem;
    background:rgba(255,255,255,.05); border:1px solid var(--tile-border); color:var(--pearl);
    font-family:inherit;
  }
  .modal-field input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .modal-error{ font-size:.78rem; color:#ff8a93; margin-bottom:10px; min-height:1.1em; }
  .modal-btn{
    width:100%; padding:11px; border-radius:12px; border:0; cursor:pointer;
    font-family:inherit; font-weight:800; font-size:.9rem; margin-bottom:10px;
    background:linear-gradient(180deg,#e8c876,var(--gold)); color:#241a04;
  }
  .modal-btn:disabled{ opacity:.6; cursor:default; }
  .modal-link{ background:none; border:0; color:var(--dim); font-size:.78rem; text-decoration:underline; cursor:pointer; font-family:inherit; }
  .modal-close{
    position:absolute; top:12px; inset-inline-start:14px; background:none; border:0;
    color:var(--dim); font-size:1.2rem; line-height:1; cursor:pointer; padding:4px;
  }
</style>
</head>
<body>
  <button class="account-chip" id="accountChip">🔓 تسجيل الدخول</button>

  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <button class="modal-close" id="authClose" aria-label="إغلاق">✕</button>
      <h2 id="authTitle">تسجيل الدخول</h2>
      <p class="modal-sub">حساب واحد لكل ألعاب لعبتك</p>
      <div class="modal-field">
        <label for="authEmail">البريد الإلكتروني</label>
        <input type="email" id="authEmail" autocomplete="email">
      </div>
      <div class="modal-field">
        <label for="authPassword">كلمة المرور</label>
        <input type="password" id="authPassword" autocomplete="current-password">
      </div>
      <p class="modal-error" id="authError"></p>
      <button class="modal-btn" id="authSubmit">تسجيل الدخول</button>
      <button class="modal-link" id="authToggle">ليس لديك حساب؟ أنشئ واحداً</button>
    </div>
  </div>

  <div class="hub">
    <div class="heading">
      <img class="logo" src="la3btak-logo.png" alt="لعبتك">
      <p class="sub">ألعاب عربية، بروح واحدة</p>
    </div>

    <div class="games">
      <a class="card dana" href="dana/">
        <span class="icon">
          <span class="tiles"><span>د</span><span>ا</span><span>ن</span></span>
        </span>
        <span class="text">
          <h2>دانة</h2>
          <p>لعبة الكلمات الخليجية — خمّن الكلمة في ست محاولات</p>
        </span>
        <span class="go">›</span>
      </a>

      <a class="card blocks" href="blocks/">
        <span class="icon">
          <span class="blockshape">
            <span class="sq a"></span><span class="sq b"></span><span class="sq c"></span>
          </span>
        </span>
        <span class="text">
          <h2>مكعبات بلس</h2>
          <p>ألغاز المكعبات — اسحب واملأ الخطوط واحصد النقاط</p>
        </span>
        <span class="go">›</span>
      </a>

      <a class="card itlak" href="itlak/">
        <span class="icon">
          <span class="crosshair">
            <span class="ring outer"></span>
            <span class="ring inner"></span>
            <span class="line v"></span>
            <span class="line h"></span>
            <span class="dot"></span>
          </span>
        </span>
        <span class="text">
          <h2>إطلاق</h2>
          <p>ميدان رماية فضائي — أطلق النار واصعد بمستواك وطوّر أسلحتك</p>
        </span>
        <span class="go">›</span>
      </a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword,
      createUserWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1pPAZWBUGf2mfSqK0xDYCAw1Xtn15-GI",
      authDomain: "la3btak-7fcc7.firebaseapp.com",
      databaseURL: "https://la3btak-7fcc7-default-rtdb.firebaseio.com",
      projectId: "la3btak-7fcc7",
      storageBucket: "la3btak-7fcc7.firebasestorage.app",
      messagingSenderId: "30284937084",
      appId: "1:30284937084:web:8042832571605d7e76d6f9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const chip = document.getElementById('accountChip');
    const modal = document.getElementById('authModal');
    const closeBtn = document.getElementById('authClose');
    const emailInput = document.getElementById('authEmail');
    const passInput = document.getElementById('authPassword');
    const errorEl = document.getElementById('authError');
    const submitBtn = document.getElementById('authSubmit');
    const toggleBtn = document.getElementById('authToggle');
    const titleEl = document.getElementById('authTitle');

    let mode = 'login';
    let currentUser = null;

    function openModal(){ errorEl.textContent = ''; emailInput.value=''; passInput.value=''; modal.classList.add('open'); emailInput.focus(); }
    function closeModal(){ modal.classList.remove('open'); }

    function setMode(m){
      mode = m;
      const isLogin = mode === 'login';
      titleEl.textContent = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
      submitBtn.textContent = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
      toggleBtn.textContent = isLogin ? 'ليس لديك حساب؟ أنشئ واحداً' : 'لديك حساب بالفعل؟ سجّل الدخول';
      errorEl.textContent = '';
    }

    chip.addEventListener('click', () => {
      if (currentUser) signOut(auth).catch(() => {});
      else { setMode('login'); openModal(); }
    });
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    toggleBtn.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
    passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });

    submitBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passInput.value;
      if (!email || !password){ errorEl.textContent = 'الرجاء تعبئة الحقول.'; return; }
      errorEl.textContent = '';
      submitBtn.disabled = true;
      try {
        if (mode === 'login') await signInWithEmailAndPassword(auth, email, password);
        else await createUserWithEmailAndPassword(auth, email, password);
        closeModal();
      } catch (err) {
        errorEl.textContent = 'حدث خطأ ما. تحقق من بياناتك وحاول مرة أخرى.';
      } finally {
        submitBtn.disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        chip.textContent = '👤 ' + (user.email ? user.email.split('@')[0] : 'حسابي');
        chip.classList.add('signed-in');
      } else {
        chip.textContent = '🔓 تسجيل الدخول';
        chip.classList.remove('signed-in');
      }
    });
  </script>
</body>
</html>
