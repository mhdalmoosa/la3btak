<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c1c28">
<title>دانة ومكعبات بلس</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap');

  :root{
    --sea:#0c1c28; --sea2:#122a3a; --tile:#16303f; --tile-border:#2b4a5d;
    --pearl:#f3ecdc; --dim:#8ba3b3; --gold:#d8b45a;
    --correct:#2f9b77; --present:#c9932b;
    --blocks:#5B9BD5; --blocks-deep:#244B78;
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    min-height:100dvh; overflow-x:hidden;
    background:
      radial-gradient(640px 420px at 82% 6%, rgba(216,180,90,.10), rgba(216,180,90,0) 60%),
      radial-gradient(560px 380px at 12% 96%, rgba(91,155,213,.09), rgba(91,155,213,0) 60%),
      radial-gradient(1200px 600px at 50% -10%, var(--sea2), var(--sea) 70%);
    color:var(--pearl); font-family:'Tajawal', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }

  .hub{ width:100%; max-width:560px; padding:44px 22px 48px; display:flex; flex-direction:column; align-items:center; gap:30px; }

  .heading{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .logo{
    width:min(340px, 74vw); height:auto; display:block;
    filter:drop-shadow(0 0 30px rgba(216,180,90,.24));
  }
  .sub{ font-size:.94rem; color:var(--dim); font-weight:500; text-wrap:balance; }

  .games{ width:100%; display:flex; flex-direction:column; gap:14px; }
  @media (min-width:600px){ .games{ flex-direction:row; } }

  .card{
    --glow: rgba(216,180,90,.28);
    flex:1; display:flex; align-items:center; gap:16px;
    padding:18px 18px; border-radius:20px;
    border:1px solid var(--tile-border);
    background:linear-gradient(160deg, var(--sea2), var(--tile) 75%);
    text-decoration:none; color:var(--pearl);
    position:relative; overflow:hidden;
    transition:transform .2s cubic-bezier(.22,.85,.32,1), box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover, .card:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 14px 34px var(--glow);
    border-color:var(--gold);
  }
  .card:active{ transform:translateY(-1px) scale(.99); }
  .card:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .card.blocks{ --glow: rgba(91,155,213,.30); }
  .card.blocks:hover, .card.blocks:focus-visible{ border-color:var(--blocks); }

  .icon{ flex:0 0 auto; width:60px; height:60px; display:flex; align-items:center; justify-content:center; }

  /* دانة icon: three mini letter tiles */
  .tiles{ display:flex; gap:3px; }
  .tiles span{
    width:17px; height:17px; border-radius:5px; display:flex; align-items:center; justify-content:center;
    font-size:.62rem; font-weight:800; color:#06231a;
  }
  .tiles span:nth-child(1){ background:radial-gradient(circle at 35% 30%, #49bd95, var(--correct) 65%); }
  .tiles span:nth-child(2){ background:var(--present); color:#241a04; }
  .tiles span:nth-child(3){ background:var(--tile); border:1.5px solid var(--tile-border); color:var(--dim); }

  /* مكعبات icon: mini L-block */
  .blockshape{ position:relative; width:44px; height:44px; }
  .sq{
    position:absolute; width:18px; height:18px; border-radius:5px;
    background:linear-gradient(178deg,#4F94C9,#204C74 70%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.28);
  }
  .sq.a{ left:0; top:0; } .sq.b{ left:20px; top:0; } .sq.c{ left:0; top:20px; }

  .text{ display:flex; flex-direction:column; gap:3px; text-align:right; }
  .text h2{ font-size:1.12rem; font-weight:800; }
  .card.dana h2{ color:var(--gold); }
  .card.blocks h2{ color:var(--blocks); }
  .text p{ font-size:.8rem; color:var(--dim); font-weight:500; }

  .go{ flex:0 0 auto; margin-inline-start:auto; font-size:1.1rem; color:var(--dim); opacity:.7; transition:transform .2s ease; }
  .card:hover .go{ transform:translateX(-4px); opacity:1; }

  @media (prefers-reduced-motion: reduce){
    .card, .go{ transition:none; }
    .card:hover{ transform:none; }
  }
</style>
</head>
<body>
  <div class="hub">
    <div class="heading">
      <img class="logo" src="la3btak-logo.png" alt="لعبتك">
      <p class="sub">لعبتان عربيتان، بروح واحدة</p>
    </div>

    <div class="games">
      <a class="card dana" href="dana/">
        <span class="icon">
          <span class="tiles"><span>د</span><span>ا</span><span>ن</span></span>
        </span>
        <span class="text">
          <h2>دانة</h2>
          <p>لعبة الكلمات الخليجية — خمّن الكلمة في ست محاولات</p>
        </span>
        <span class="go">›</span>
      </a>

      <a class="card blocks" href="blocks/">
        <span class="icon">
          <span class="blockshape">
            <span class="sq a"></span><span class="sq b"></span><span class="sq c"></span>
          </span>
        </span>
        <span class="text">
          <h2>مكعبات بلس</h2>
          <p>ألغاز المكعبات — اسحب واملأ الخطوط واحصد النقاط</p>
        </span>
        <span class="go">›</span>
      </a>
    </div>
  </div>
</body>
</html>
